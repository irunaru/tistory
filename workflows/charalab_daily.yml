name: CharaLab Daily Crawler (05:00 AM KST)

on:
  schedule:
    - cron: '0 20 * * *'   # 매일 KST 05:00

  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 클론
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase google-generativeai beautifulsoup4 python-dotenv requests

      - name: 크롤링 + 번역 + Supabase 저장
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:  gemini-2.5-flash-lite
        run: python charalab_crawler.py

      - name: 이력 파일 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_articles_charalab.json || true
          git commit -m "chore: update charalab history [skip ci]" || true
          git push || true
