name: CharaLab News Crawler V6.1

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '이미 처리된 기사도 재처리할까요?'
        required: false
        default: 'false'
        type: choice
        options: 
          - 'true'
          - 'false'
      target_url:
        description: '특정 기사 URL'
        required: false
      gemini_model:
        description: '모델 선택'
        required: true
        default: 'gemini-pro'
        type: choice
        options: 
          - 'gemini-pro'
          - 'gemini-1.5-flash'
          - 'gemini-1.5-pro'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 환경 변수 확인 (Debug)
        run: |
          echo "=== workflow_dispatch Inputs ==="
          echo "FORCE_UPDATE: ${{ github.event.inputs.force_update }}"
          echo "GEMINI_MODEL: ${{ github.event.inputs.gemini_model }}"
          echo "TARGET_URL: ${{ github.event.inputs.target_url }}"
          echo "================================"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase google-generativeai python-dotenv

      - name: Run Crawler V6.1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
          TARGET_URL: ${{ github.event.inputs.target_url || '' }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-pro' }}
        run: |
          python charalab_crawler.py

      - name: Commit Tracking History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_articles_charalab.json || true
          git commit -m "chore: update history [skip ci]" || true
          git push || true
