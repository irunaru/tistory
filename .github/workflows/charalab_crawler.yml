name: CharaLab News Crawler V6

on:
  schedule:
    # 매일 한국 시간 오전 5시 (UTC 20:00) 실행
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '이미 처리된 기사도 재처리할까요?'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      target_url:
        description: '특정 기사 1개만 처리하고 싶으면 URL 입력'
        required: false
      gemini_model:
        description: '사용할 모델 선택'
        required: true
        default: 'gemini-pro'
        type: choice
        options:
        - 'gemini-pro'
        - 'gemini-1.5-pro'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 이력 파일 커밋을 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase google-generativeai python-dotenv

      - name: Run Crawler V6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
          TARGET_URL: ${{ github.event.inputs.target_url || '' }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-pro' }}
        run: |
          python charalab_crawler.py

      - name: Commit and push tracking history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_articles_charalab.json || true
          git commit -m "chore: update posted articles history [skip ci]" || true
          git push || true
