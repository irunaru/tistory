name: CharaLab to Tistory Auto Posting

on:
  schedule:
    # 매 1시간마다 실행 (상태가 'ready'인 기사 자동 감시)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      save_as_private:
        description: '비공개로 저장할까요? (검증용)'
        required: false
        default: 'false'
        type: choice
        options: 
          - 'true'
          - 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 세션 파일 등을 읽기 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv
          playwright install chromium

      - name: Run Auto Posting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TISTORY_LOGIN_ID: ${{ secrets.TISTORY_ID }}
          TISTORY_PASSWORD: ${{ secrets.TISTORY_PASSWORD }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
          SAVE_AS_PRIVATE: ${{ github.event.inputs.save_as_private || 'false' }}
        run: |
          # 세션 파일(auth.json)이 저장소에 있다면 사용, 없으면 새로 로그인
          python charalab_to_tistory.py
