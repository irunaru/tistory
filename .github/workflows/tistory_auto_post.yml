# .github/workflows/tistory_auto_post.yml
name: Tistory 자동 글쓰기

on:
  # 정기 실행 (4시간마다, 업무 시간만)
  schedule:
    - cron: '0 9,13,17,21 * * *'  # 09:00, 13:00, 17:00, 21:00 KST (UTC +9)
  
  # 수동 트리거
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TISTORY_ID: ${{ secrets.TISTORY_ID }}
  TISTORY_PASSWORD: ${{ secrets.TISTORY_PASSWORD }}

jobs:
  tistory-posting:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # auth.json 커밋 권한
    
    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # 2. Python 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Playwright 브라우저 설치
      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      
      # 4. 의존성 설치
      - name: Install dependencies
        run: |
          pip install -q \
            playwright \
            supabase \
            python-dotenv
      
      # 5. 암호화된 auth.json 복호화 (첫 실행 시 생성됨)
      - name: Decrypt auth.json (if exists)
        if: hashFiles('auth.json.gpg') != ''
        run: |
          echo "${{ secrets.AUTH_JSON_PASSPHRASE }}" | gpg --quiet --batch --yes --decrypt --passphrase-fd 0 auth.json.gpg > auth.json
      
      # 6. Tistory 자동 글쓰기 실행
      - name: Run Tistory auto-posting
        run: python playwright_tistory_core.py
        continue-on-error: true  # 실패해도 다음 단계 진행
      
      # 7. 새 auth.json 암호화 및 커밋
      - name: Encrypt and commit auth.json
        if: always()  # 성공/실패 상관없이 실행
        run: |
          # auth.json이 존재하고 변경되었으면 암호화
          if [ -f auth.json ]; then
            echo "${{ secrets.AUTH_JSON_PASSPHRASE }}" | \
              gpg --quiet --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 auth.json
            
            # 원본 auth.json 삭제 (로그에 남지 않도록)
            rm auth.json
            
            # 암호화된 파일 커밋
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add auth.json.gpg
            git commit -m "chore: update encrypted auth.json [skip ci]" || true
            git push
          fi
      
      # 8. 실패 로그 확인 (선택사항)
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-logs
          path: |
            .playwright/
            *.log
          retention-days: 7
